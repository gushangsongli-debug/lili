<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 聊天小手机</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 桌面容器 -->
    <div class="desktop" id="desktop"></div>

    <!-- 身份软件页面（浏览器风格） -->
    <div class="app-page" id="page-identity">
        <!-- 浏览器顶栏 -->
        <div class="browser-bar">
            <div class="browser-controls">
                <span class="dot dot-red" id="identity-close"></span>
                <span class="dot dot-yellow"></span>
                <span class="dot dot-green"></span>
            </div>
            <div class="browser-url">
                <span class="url-icon">🔒</span>
                <span class="url-text">shenfen</span>
            </div>
            <div class="browser-actions">
                <button class="add-btn" id="identity-add-btn">＋</button>
            </div>
        </div>

        <!-- 身份内容区域 -->
        <div class="browser-content" id="identity-content">
            <!-- 人设卡片列表 -->
            <div class="identity-list" id="identity-list">
                <!-- 动态生成的拍立得卡片 -->
            </div>
        </div>

        <!-- 编辑弹窗 -->
        <div class="modal-overlay" id="identity-modal">
            <div class="modal-box">
                <div class="modal-header">
                    <span class="modal-title">新建人设</span>
                    <button class="modal-close-btn" id="modal-close-btn">✕</button>
                </div>
                <div class="modal-body">
                    <div class="avatar-upload" id="avatar-upload">
                        <img src="" alt="" class="avatar-preview" id="avatar-preview">
                        <div class="avatar-placeholder" id="avatar-placeholder">
                            <svg viewBox="0 0 24 24" width="32" height="32" stroke="#999" fill="none" stroke-width="1.5">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                <polyline points="21 15 16 10 5 21"></polyline>
                            </svg>
                            <span>点击上传头像</span>
                        </div>
                        <input type="file" accept="image/*" id="avatar-input" hidden>
                    </div>
                    <div class="form-group">
                        <label>名字</label>
                        <input type="text" id="input-name" placeholder="输入角色名字">
                    </div>
                    <div class="form-group">
                        <label>ID</label>
                        <input type="text" id="input-id" placeholder="输入唯一ID">
                    </div>
                    <div class="form-group">
                        <label>人设</label>
                        <textarea id="input-persona" placeholder="输入角色人设描述..."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn-cancel" id="btn-cancel">取消</button>
                    <button class="btn-save" id="btn-save">保存</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
