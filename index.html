<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 聊天小手机</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ========== 桌面 ========== -->
    <div class="desktop" id="desktop"></div>

    <!-- ========== 身份软件（浏览器风格） ========== -->
    <div class="app-window" id="window-identity" style="display:none;">
        <!-- 浏览器顶栏 -->
        <div class="browser-bar">
            <div class="browser-dots">
                <span class="dot red" id="identity-close"></span>
                <span class="dot yellow"></span>
                <span class="dot green"></span>
            </div>
            <div class="browser-address">
                <span class="address-text">shenfen</span>
            </div>
        </div>
        <!-- 浏览器内容区 -->
        <div class="browser-body" id="identity-body">
            <!-- 拍立得卡片列表 -->
            <div class="polaroid-list" id="polaroid-list"></div>
            <!-- 添加按钮（黑色加号） -->
            <div class="add-btn" id="identity-add-btn">
                <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </div>
        </div>
    </div>

    <!-- ========== 添加人设表单弹窗 ========== -->
    <div class="form-overlay" id="identity-form-overlay" style="display:none;">
        <div class="form-card">
            <div class="form-title">新建人设</div>
            <!-- 头像上传 -->
            <div class="avatar-upload" id="avatar-upload">
                <input type="file" accept="image/*" id="avatar-input" hidden>
                <div class="avatar-preview" id="avatar-preview">
                    <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                </div>
                <span class="avatar-hint">点击上传头像</span>
            </div>
            <!-- 表单字段 -->
            <div class="form-group">
                <label>名字</label>
                <input type="text" id="form-name" placeholder="输入角色名字">
            </div>
            <div class="form-group">
                <label>ID</label>
                <input type="text" id="form-id" placeholder="输入唯一ID">
            </div>
            <div class="form-group">
                <label>人设</label>
                <textarea id="form-persona" placeholder="描述这个角色的性格、背景..."></textarea>
            </div>
            <!-- 按钮 -->
            <div class="form-actions">
                <button class="btn-cancel" id="form-cancel">取消</button>
                <button class="btn-save" id="form-save">保存</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
