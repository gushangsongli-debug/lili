<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 聊天小手机</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. 桌面区域 -->
    <div class="desktop" id="desktop">
        <!-- 32个格子将由 JS 动态生成 -->
    </div>

    <!-- 2. 应用运行窗口 -->
    <div class="app-window" id="app-window">
        
        <!-- 浏览器风格头部 -->
        <div class="browser-header">
            <button class="btn-nav" id="btn-close-app">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
            <div class="browser-url" id="browser-url"></div>
            <button class="btn-nav">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
            </button>
        </div>

        <!-- 应用内容容器 -->
        <div class="app-content" id="app-content">
            
            <!-- ================= 身份 (Identity) 软件界面 ================= -->
            <div id="view-app-identity" class="app-view">
                <div class="identity-container">
                    
                    <!-- 表单区域 (去掉了大字标题) -->
                    <div class="form-card">
                        <div class="form-group">
                            <label>头像 (本地导入)</label>
                            <div class="file-upload-wrapper">
                                <input type="file" id="input-avatar-file" accept="image/*" hidden>
                                <label for="input-avatar-file" class="btn-upload">选择图片</label>
                                <span id="file-name-display" class="file-name">未选择文件</span>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>名字</label>
                            <input type="text" id="input-name" placeholder="输入角色名字">
                        </div>
                        <div class="form-group">
                            <label>唯一 ID</label>
                            <input type="text" id="input-id" placeholder="例如: @cyber_girl_01">
                        </div>
                        <div class="form-group">
                            <label>人设与背景</label>
                            <textarea id="input-persona" rows="3" placeholder="描述这个角色的性格、背景..."></textarea>
                        </div>
                        <!-- 纯黑色的添加按钮 -->
                        <button class="btn-black" id="btn-add-identity">添加人设</button>
                    </div>

                    <!-- 拍立得展示画廊 (支持多个人设) -->
                    <div id="polaroid-gallery" class="polaroid-gallery">
                        <!-- 动态生成的拍立得卡片会放在这里 -->
                    </div>

                </div>
            </div>
            <!-- 其他软件的界面后续会加在这里 -->

        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
